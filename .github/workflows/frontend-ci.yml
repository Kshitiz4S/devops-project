name: Frontend CI

on:
  push:
    branches: [ "staging" ]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: write

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/art-gallery-frontend

jobs:
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: v24.13.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

  docker:
    name: Build, Scan & Push
    needs: frontend-ci
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate short commit SHA
        id: vars
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::5}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          load: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # - name: Scan image with Trivy
      #   uses: aquasecurity/trivy-action@v0.36.0
      #   with:
      #     image-ref: ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.SHORT_SHA }}
      #     format: table
      #     exit-code: 1
      #     ignore-unfixed: false
      #     vuln-type: os,library
      #     severity: CRITICAL,HIGH   # Total: 13 (HIGH: 11, CRITICAL: 2) 

      - name: Push image to Docker Hub
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.SHORT_SHA }}

      - name: Update Kubernetes Manifests File
        run: |
          cat kubernetes/frontend/deployment.yml
          sed -i "s|image: kshitiz182/art-gallery-frontend:.*|image: kshitiz182/art-gallery-frontend:${{ steps.vars.outputs.SHORT_SHA }}|g" kubernetes/frontend/deployment.yml
          cat kubernetes/frontend/deployment.yml

      - name: Commit the changes
        run: |
          git config --global user.email "<>"
          git config --global user.name "GitHub Actions Bot"
          git add kubernetes/frontend/deployment.yml
          git commit -m "Update deployment.yml with new image version - ${{ steps.vars.outputs.SHORT_SHA }}"
          git push origin staging

