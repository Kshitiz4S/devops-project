apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: artgallery
spec:
  replicas: 1

  selector:
    matchLabels:
      app: nginx

  template:
    metadata:
      labels:
        app: nginx

    spec:
      nodeSelector:
        artgallery-media: "true"

      containers:
        - name: nginx
          image: nginx:alpine

          ports:
            - containerPort: 80

          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf

            - name: media-storage
              mountPath: /app/media

      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config

        - name: media-storage
          persistentVolumeClaim:
            claimName: media-pvc