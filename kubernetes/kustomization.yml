apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yml

  - storage/postgres-pvc.yml
  - storage/media-pvc.yml

  - postgres/deployment.yml
  - postgres/service.yml

  - backend/deployment.yml
  - backend/service.yml
  - backend/migrate.yml

  - frontend/deployment.yml
  - frontend/service.yml

  - nginx/configmap.yml
  - nginx/deployment.yml
  - nginx/service.yml

  - secrets/postgres-secret.yml
  - secrets/backend-secret.yml
