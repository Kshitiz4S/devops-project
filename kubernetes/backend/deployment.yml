apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: artgallery
spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      nodeSelector:
        artgallery-media: "true"

      containers:
        - name: backend
          image: kshitiz182/art-gallery-backend:7baba
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          envFrom:
            - secretRef:
                name: backend-secret

          volumeMounts:
            - name: media-storage
              mountPath: /app/media

          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20

      volumes:
        - name: media-storage
          persistentVolumeClaim:
            claimName: media-pvc