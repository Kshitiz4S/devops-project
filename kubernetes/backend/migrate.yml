apiVersion: batch/v1
kind: Job
metadata:
  name: backend-migrate
  namespace: artgallery
  annotations:
    argocd.argoproj.io/sync-wave: "1"

spec:
  backoffLimit: 3

  template:
    spec:
      restartPolicy: Never

      containers:
        - name: migrate
          image: kshitiz182/art-gallery-backend:25e1d

          envFrom:
            - secretRef:
                name: backend-secret

          command:
            - python3
            - manage.py
            - migrate
            - --noinput