apiVersion: batch/v1
kind: Job
metadata:
  name: backend-migrate
  namespace: artgallery
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation

spec:
  backoffLimit: 3

  template:
    spec:
      restartPolicy: Never

      containers:
        - name: migrate
          image: kshitiz182/art-gallery-backend:7baba

          envFrom:
            - secretRef:
                name: backend-secret

          command:
            - python
            - manage.py
            - migrate
            - --noinput